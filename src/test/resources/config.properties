baseUrl=https://istyle.ae
# Phone to imitate: iPhone 16 Pro Max | iPhone 12 Pro | Pixel 7   (or -Ddevice="Pixel 7")
device=iPhone 16 Pro Max
# false = the browser window is visible. true = it runs in the background (or use -Dheadless=true).
# The OTP step never opens a window: it reads the mailbox through the catchmail.io API.
headless=false
timeout=15
# Seconds to wait after every step, so each action can finish before the next one starts
stepDelaySeconds=2
# Seconds to wait after the code is typed, before the next step
afterVerifyWaitSeconds=3

# Test data (email and phone are generated for every run, see TestData.java)
# Email sequence: <emailPrefix><number>@<emailDomain>  ->  testuserautomation1@catchmail.io, testuserautomation2@catchmail.io ...
emailPrefix=testuserautomation
emailDomain=catchmail.io
emailStartNumber=1
emailCounterFile=email-counter.txt
firstName=Test
lastName=User
searchText=iphone 16

# The registration OTP is read from the catchmail.io mailbox of the test email (web API, no captcha, no browser)
catchmailApiUrl=https://api.catchmail.io
# Pattern of the OTP inside the email (here: 6 digits). Change it if the site sends 4 or 5 digits.
otpRegex=\\b\\d{6}\\b
otpWaitSeconds=60

# Shipping address (emirate is the option value: AZ Abu Dhabi, AJ Ajman, DU Dubai, FU Fujairah, RK Ras al-Khaimah, SH Sharjah, UQ Umm al-Quwain)
addressLine1=Sheikh Zayed Road, Test Tower
addressLine2=Apartment 101
areaName=Business Bay
emirate=DU
expectedCountry=United Arab Emirates

# Test card (a dummy Visa: the payment is declined, and the declined message is the expected end of the test)
cardNumber=4111111111111111
cardExpiry=0330
cardCvv=737
cardName=Test
paymentErrorWaitSeconds=60

# Big payload POST test (@bigpayload): an echo service that sends back what it receives
bigPayloadUrl=https://httpbin.org/post